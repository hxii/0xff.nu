                <a href="https://webring.xxiivv.com/"><img src="https://0xff.nu/webring.png" alt="Webring"></a>
                <a href="#"><img src="https://0xff.nu/pg.png" alt="Meta Icon"></a>
                <span class="last-generated">GEN {{ now()|dtformat }}</span>
                <a id="scroll-top" href="#top">&uarr;</a>
            </footer>
        </main>
        <script>
            document.getElementById("theme-toggle").addEventListener("click", ()=>{
                if (document.body.className.includes("dark")) {
                    document.body.classList.remove('dark');
                    localStorage.setItem("pref-theme", 'light');
                } else {
                    document.body.classList.add('dark');
                    localStorage.setItem("pref-theme", 'dark');
                }
            }
            )
        </script>
        <script>
            if (localStorage.getItem("pref-theme") === "dark") {
                document.body.classList.add('dark');
            } else if (localStorage.getItem("pref-theme") === "light") {
                document.body.classList.remove('dark')
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark');
            }
        </script>
    </body>
</html>
