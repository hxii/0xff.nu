<!doctype html>
<html lang="en">
{% include "./parts/head.html" %}
<body class="desktop-page" data-start-key="note:{{ entry.uri | escape }}">
  <div class="boot" aria-hidden="true"></div>
  <header class="menubar">
    <a class="button" href="/" aria-label="Return to the desktop">0xff.nu</a>
    <span class="home-hint">&#9666; home</span>
  </header>
  <main class="desktop">
    <a class="obj home-object" href="/" aria-label="Return to the desktop">
      <span class="icon">⌂</span>
      <span class="label">Desktop</span>
    </a>
    <div class="modal-layer">
      <section class="modal wide static-note is-front iv" data-key="note:{{ entry.uri | escape }}" data-url="/{{ entry.uri | escape }}/" data-summary="{{ entry.title | escape }}" style="left:60px;top:30px;display:flex;view-transition-name:note-{{ entry.uri | escape }};">
        <header class="modal-head">
          <span class="title" role="heading" aria-level="1">{{ entry.title | escape }}</span>
        </header>
        <div class="modal-info">
          <time class="mi-date" datetime="{{ entry.date.strftime('%Y-%m-%d') }}">{{ entry.date.strftime('%Y-%m-%d') }}</time>
          {% for tag in entry.tags %}<span class="mi-tag">#{{ tag | escape }}</span>{% endfor %}
          {% if entry.description %}<span class="mi-desc">{{ entry.description | escape }}</span>{% endif %}
        </div>
        <div class="modal-body"><figure class="image-view"><img src="/{{ entry.image | escape }}" alt="{{ entry.title | escape }}" draggable="false"></figure></div>
      </section>
    </div>
  </main>
  <div class="popup"></div>
  <script type="application/json" id="note-index">{{ context.note_index_json() }}</script>
  <script src="../site.js"></script>
</body>
</html>
