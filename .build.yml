image: alpine/edge
oauth: pages.sr.ht/PAGES:RW
packages:
  - python3
  - rust
  - uv
  - cargo
  - hut
sources:
  - https://git.sr.ht/~hxii/hajime
environment:
  site: 0xff.nu
tasks:
  - setup: |
      cd hajime
      uv tool install .
  - package: |
      cd $site
      uvx hajime --verbose build --compress
      tar -C html -cvz . > ../site.tar.gz
  - upload: |
      hut pages publish -d $site site.tar.gz
